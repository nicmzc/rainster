<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rainster</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1a1a24">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative&family=IM+Fell+English&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>

html {
    -webkit-text-size-adjust: 100%;
    -moz-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

/* ===== COLORES DEL FONDO DEL INICIO ===== */
:root {
    --fondo-brillo-arriba: rgba(170, 0, 0, 0.55);
    --fondo-brillo-abajo: rgba(120, 0, 0, 0.45);
    --fondo-centro: #000000;
    --fondo-medio: #0d0000;
    --fondo-borde: #000000;
}
      
        #menu {
            position: fixed;
            inset: 0;
            z-index: 1000;
            overflow: hidden;
            background:
    radial-gradient(circle at 92% 4%, var(--fondo-brillo-arriba), transparent 45%),
    radial-gradient(circle at 8% 92%, var(--fondo-brillo-abajo), transparent 40%),
    radial-gradient(circle at 40% 30%, var(--fondo-centro) 0%, var(--fondo-medio) 55%, var(--fondo-borde) 90%);
          transition: opacity 0.6s;
        }
        #menu.oculto { opacity: 0; pointer-events: none; }

        #puntos {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
      
      #fuegoFondo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
      }

        .pantalla {
            position: absolute;
            inset: 0;
            transition: transform 1s cubic-bezier(0.7, 0, 0.2, 1);
        }
        #pantallaConfig { transform: translateX(100%); }
        #menu.config #pantallaInicio { transform: translateX(-100%); }
        #menu.config #pantallaConfig { transform: translateX(0); }

        .titulo {
            position: absolute;
            top: 6vh;
            left: 3vw;
            margin: 0;
            padding: 0.3rem 4rem 0.3rem 1.5rem;
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(2.2rem, 7vw, 5rem);
            color: #000000;
            letter-spacing: 6px;
            text-shadow: 0 0 10px #ff0000, 0 0 30px #7a0000, 0 0 60px #400000;
            animation: flicker 5s infinite;
        }
        .titulo.chico { font-size: clamp(1.8rem, 5vw, 3.5rem); }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            45% { opacity: 1; }
            50% { opacity: 0.4; }
            55% { opacity: 1; }
            80% { opacity: 0.8; }
        }

        .botones {
            position: absolute;
            right: 3vw;
            bottom: 12vh;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2rem;
        }
        .boton {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.4rem, 3.5vw, 2.6rem);
            letter-spacing: 3px;
            color: #ffffff;
            background: linear-gradient(to left, rgba(30, 0, 0, 0.9), rgba(60, 0, 0, 0.85) 70%, transparent);
            border: none;
            padding: 0.3rem 1.2rem 0.3rem 4rem;
            cursor: pointer;
            text-shadow: 0 0 10px #ff0000, 0 0 25px #7a0000;
            transition: transform 0.2s, text-shadow 0.2s;
        }
        .boton:hover {
            transform: translateX(-10px);
            text-shadow: 0 0 14px #ff2a2a, 0 0 40px #b00000;
        }

        #version {
            position: absolute;
            left: 3vw;
            bottom: 4vh;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #dddddd;
        }

        /* ===== PANTALLA JUGAR ===== */
        #pantallaJugar {
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
        }
        #menu.jugar #pantallaInicio { transform: translateX(-100%); }
        #menu.jugar #pantallaJugar { transform: translateX(0); }

        .pestanas {
            display: flex;
            align-items: stretch;
            gap: 1.5rem;
            padding: 4vh 3vw 1.2vh;
            border-bottom: 2px solid rgba(255, 215, 220, 0.85);
            box-shadow: 0 3px 14px rgba(255, 0, 0, 0.3);
        }
        .pestana {
            background: none;
            border: none;
            padding: 0;
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.2rem, 3.2vw, 2.4rem);
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.4);
            text-shadow: 0 0 10px #7a0000;
            cursor: pointer;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .pestana:hover { color: rgba(255, 255, 255, 0.75); }
        .pestana.activa {
            color: #ffffff;
            text-shadow: 0 0 10px #ff0000, 0 0 25px #7a0000;
        }
        .separador { width: 2px; background: rgba(255, 215, 220, 0.85); }

        .cuerpoJugar { flex: 1; overflow-y: auto; padding: 2.5vh 3vw; }

        .partida {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1.6rem;
            margin-bottom: 1.6vh;
            border: 2px solid rgba(255, 215, 220, 0.85);
            border-radius: 20px;
            background: rgba(50, 0, 0, 0.55);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .partida:hover {
            transform: translateX(6px);
            box-shadow: 0 0 18px rgba(255, 0, 0, 0.5);
        }
        .partidaNombre {
            font-family: 'IM Fell English', Georgia, 'Times New Roman', serif;
            font-size: clamp(1.1rem, 2.6vw, 1.9rem);
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px #ff0000, 0 0 22px #7a0000;
        }
        .partidaInfo {
            margin-top: 0.3rem;
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(0.8rem, 1.6vw, 1.1rem);
            color: #d9b8b8;
        }
        .partidaBorrar {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.4rem;
            cursor: pointer;
            opacity: 0.6;
            text-shadow: 0 0 8px #ff0000;
        }
        .partidaBorrar:hover { opacity: 1; }
        .vacio {
            margin-top: 4vh;
            text-align: center;
            font-family: 'Cinzel Decorative', serif;
            letter-spacing: 2px;
            color: #d9b8b8;
        }

        .pieJugar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2vh 3vw 3vh;
            border-top: 2px solid rgba(255, 215, 220, 0.85);
            box-shadow: 0 -3px 14px rgba(255, 0, 0, 0.3);
        }
        .pieJugar .enlace { position: absolute; left: 3vw; }
        .botonCrear {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.1rem, 2.6vw, 1.8rem);
            letter-spacing: 3px;
            color: #ffffff;
            background: rgba(60, 0, 0, 0.6);
            border: 2px solid rgba(255, 215, 220, 0.85);
            border-radius: 24px;
            padding: 0.6rem 2.4rem;
            cursor: pointer;
            text-shadow: 0 0 10px #ff0000, 0 0 25px #7a0000;
            transition: box-shadow 0.2s;
        }
        .botonCrear:hover { box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
        .botonCrear[hidden] { display: none; }

        .enlace {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1rem, 2vw, 1.4rem);
            letter-spacing: 2px;
            color: #ffffff;
            background: none;
            border: none;
            cursor: pointer;
            text-shadow: 0 0 10px #ff0000, 0 0 25px #7a0000;
        }

        /* Ventanita para ponerle nombre a la partida */
        #modalNombre {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
        }
        #modalNombre.visible { display: flex; }
        .cajaModal {
            min-width: min(90vw, 420px);
            padding: 2rem 2.4rem;
            border: 2px solid rgba(255, 215, 220, 0.85);
            border-radius: 22px;
            background: #160000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.35);
        }
        .tituloModal {
            margin: 0 0 1.2rem;
            font-family: 'Cinzel Decorative', serif;
            font-weight: normal;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px #ff0000, 0 0 22px #7a0000;
        }
        #entradaNombre {
            width: 100%;
            box-sizing: border-box;
            padding: 0.6rem 0.2rem;
            font-family: 'IM Fell English', Georgia, 'Times New Roman', serif;
            font-size: 1.3rem;
            letter-spacing: 1px;
            color: #ffffff;
            background: none;
            border: none;
            border-bottom: 2px solid rgba(255, 215, 220, 0.85);
            outline: none;
        }
        .botonesModal {
            display: flex;
            justify-content: space-between;
            margin-top: 1.6rem;
        }

.subpestanas {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.4vh 3vw 0;
}
.subpestanas[hidden] { display: none; }
.subpestana, .buscador {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(0.9rem, 2.2vw, 1.5rem);
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.5);
    background: rgba(60, 0, 0, 0.45);
    border: 2px solid rgba(255, 215, 220, 0.55);
    border-radius: 22px;
    padding: 0.35rem 1.4rem;
    cursor: pointer;
    text-shadow: 0 0 10px #7a0000;
    transition: color 0.2s, box-shadow 0.2s, border-color 0.2s;
}
.subpestana:hover { color: rgba(255, 255, 255, 0.8); }
.subpestana.activa {
    color: #ffffff;
    border-color: rgba(255, 215, 220, 0.85);
    background: rgba(90, 0, 0, 0.65);
    text-shadow: 0 0 10px #ff0000, 0 0 25px #7a0000;
    box-shadow: 0 0 14px rgba(255, 0, 0, 0.4);
}
.buscador {
    flex: 1;
    min-width: 0;
    cursor: text;
    color: #ffffff;
    outline: none;
    text-shadow: none;
    font-family: 'IM Fell English', Georgia, 'Times New Roman', serif;
    letter-spacing: 1px;
}
.buscador::placeholder {
    color: rgba(255, 255, 255, 0.5);
    font-family: 'Cinzel Decorative', serif;
    letter-spacing: 2px;
}
.buscador:focus {
    border-color: rgba(255, 215, 220, 0.85);
    box-shadow: 0 0 14px rgba(255, 0, 0, 0.4);
}

.servidorCupo {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.1rem, 2.6vw, 1.9rem);
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow: 0 0 10px #ff0000, 0 0 22px #7a0000;
    white-space: nowrap;
}
.partida.lleno { opacity: 0.55; cursor: not-allowed; }
.partida.lleno .servidorCupo { color: #ff6b6b; }

#modalServidor {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.75);
}
#modalServidor.visible { display: flex; }
.campo {
    width: 100%;
    box-sizing: border-box;
    padding: 0.5rem 0.2rem;
    font-family: 'IM Fell English', Georgia, 'Times New Roman', serif;
    font-size: 1.2rem;
    letter-spacing: 1px;
    color: #ffffff;
    background: none;
    border: none;
    border-bottom: 2px solid rgba(255, 215, 220, 0.85);
    outline: none;
}
.etiqueta {
    margin: 1rem 0 0.2rem;
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.85rem;
    letter-spacing: 2px;
    color: #d9b8b8;
}
.filaModal { display: flex; align-items: center; gap: 1rem; }
.cupoNuevo {
    min-width: 2.5rem;
    text-align: center;
    font-family: 'Cinzel Decorative', serif;
    font-size: 1.4rem;
    color: #ffffff;
}

.aviso {
    position: fixed;
    left: 50%;
    bottom: 12vh;
    z-index: 2000;
    transform: translateX(-50%);
    max-width: 90vw;
    padding: 0.7rem 1.6rem;
    font-family: 'IM Fell English', Georgia, 'Times New Roman', serif;
    font-size: 1.1rem;
    color: #ffffff;
    background: rgba(20, 0, 0, 0.92);
    border: 2px solid rgba(255, 215, 220, 0.85);
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
}
.aviso.visible { opacity: 1; }
      

/* ===== PAUSA ===== */
#pausa {
    position: fixed;
    inset: 0;
    z-index: 1500;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(3px);
}
#pausa.visible { display: flex; }
.pausaCaja {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(0.6rem, 2.4vh, 1.6rem);
    max-height: 96vh;
    overflow-y: auto;
    padding: 0.5rem 1rem;
}
.pausaTitulo {
    margin: 0 0 0.4rem;
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.6rem, 5vw, 3rem);
    letter-spacing: 6px;
    color: #ffffff;
    text-shadow: 0 0 10px #ff0000, 0 0 30px #7a0000;
}
.pausaBoton {
    width: min(80vw, 420px);
    font-size: clamp(1.1rem, 3vw, 2rem);
    padding: 0.3rem 1.5rem;
    text-align: center;
    background: linear-gradient(to right, transparent, rgba(60, 0, 0, 0.85) 30%, rgba(60, 0, 0, 0.85) 70%, transparent);
}
.pausaBoton:hover { transform: scale(1.04); }

/* ===== CONFIGURACIÓN ===== */
.configCuerpo {
    position: absolute;
    left: 3vw;
    right: 3vw;
    top: 22vh;
    bottom: 24vh;
    max-width: 720px;
    overflow-y: auto;
    padding-right: 0.5rem;
}
.seccion {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0.5rem 0.2rem;
    background: none;
    border: none;
    border-bottom: 2px solid rgba(255, 215, 220, 0.6);
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.1rem, 2.8vw, 1.8rem);
    letter-spacing: 3px;
    color: #ffffff;
    text-shadow: 0 0 10px #ff0000, 0 0 25px #7a0000;
    cursor: pointer;
}
.seccionCuerpo { padding: 0.4rem 0.2rem 0.8rem; }
.seccionCuerpo[hidden] { display: none; }
.fila {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.4rem 0;
}
.filaEtiqueta {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(0.85rem, 1.8vw, 1.2rem);
    letter-spacing: 2px;
    color: #d9b8b8;
}
.deslizador { flex: 1; max-width: 55%; accent-color: #ff2a2a; }
.valor {
    min-width: 3.5rem;
    text-align: right;
    font-family: 'Cinzel Decorative', serif;
    color: #ffffff;
}
.tecla, .interruptor {
    min-width: 7rem;
    padding: 0.25rem 1rem;
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(0.85rem, 1.8vw, 1.2rem);
    color: #ffffff;
    background: rgba(60, 0, 0, 0.6);
    border: 2px solid rgba(255, 215, 220, 0.7);
    border-radius: 16px;
    cursor: pointer;
}
.interruptor.activo {
    background: rgba(120, 0, 0, 0.75);
    box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
}

    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <canvas id="juego"></canvas>

    <!-- Botón de Configuración dentro del juego -->
    <button id="btnConfigJuego" class="boton" style="display:none; 
    position:fixed; top:20px; right:20px; z-index:900; font-size:1.1rem; 
    padding:0.3rem 1.2rem;">Pausa</button>

    <!-- MENÚ DE INICIO -->
    <div id="menu">
      <canvas id="fuegoFondo"></canvas>
        <canvas id="puntos"></canvas>

        <div id="pantallaInicio" class="pantalla">
            <h1 class="titulo">Rainster</h1>
            <div class="botones">
                <button class="boton" id="btnJugar">Jugar</button>
                <button class="boton" id="btnConfig">Configuración</button>
            </div>
            <div id="version">V.1.0</div>
        </div>

        <div id="pantallaJugar" class="pantalla">
            <div class="pestanas">
                <button class="pestana activa" id="pestanaPartidas">Partidas Guardadas</button>
                <div class="separador"></div>
                <button class="pestana" id="pestanaServidores">Servidores</button>
            </div>

            <div class="subpestanas" id="subpestanas" hidden>
                <button class="subpestana activa" id="subOnline">Online</button>
                <button class="subpestana" id="subLan">LAN</button>
                <input class="buscador" id="buscadorServidores" type="text" placeholder="Buscar" maxlength="30" autocomplete="off">
            </div>

            <div class="cuerpoJugar" id="listaPartidas"></div>
            <div class="cuerpoJugar" id="listaServidores" hidden></div>

            <div class="pieJugar">
                <button class="enlace" id="btnVolverJugar">‹ Volver</button>
                <button class="botonCrear" id="btnCrear">Crear nueva partida</button>
            </div>

            <!-- Ventana: nombre de la partida -->
            <div id="modalNombre">
                <div class="cajaModal">
                    <h2 class="tituloModal">Nombre de la partida</h2>
                    <input id="entradaNombre" type="text" maxlength="30" autocomplete="off">
                    <div class="botonesModal">
                        <button class="enlace" id="btnCancelarNombre">Cancelar</button>
                        <button class="enlace" id="btnAceptarNombre">Crear</button>
                    </div>
                </div>
            </div>

            <!-- Ventana: crear servidor -->
            <div id="modalServidor">
                <div class="cajaModal" style="max-height:88vh;overflow-y:auto;">
                    <h2 class="tituloModal">Nuevo servidor</h2>
                    <div class="etiqueta">Nombre del servidor</div>
                    <input class="campo" id="entradaServidor" type="text" maxlength="30" autocomplete="off">
                    <div class="etiqueta">Tu nombre</div>
                    <input class="campo" id="entradaHost" type="text" maxlength="20" autocomplete="off">
                    <div class="etiqueta">Jugadores máximos</div>
                    <div class="filaModal">
                        <button class="enlace" id="btnMenosJug">−</button>
                        <span class="cupoNuevo" id="cupoNuevo">10</span>
                        <button class="enlace" id="btnMasJug">+</button>
                    </div>
                    <div class="etiqueta">Tipo</div>
                    <div class="filaModal">
                        <button class="subpestana activa" id="tipoOnline">Online</button>
                        <button class="subpestana" id="tipoLan">LAN</button>
                    </div>
                    <div class="botonesModal">
                        <button class="enlace" id="btnCancelarServidor">Cancelar</button>
                        <button class="enlace" id="btnAceptarServidor">Crear</button>
                    </div>
                </div>
            </div>
        </div>

      <div id="pantallaConfig" class="pantalla">
            <h1 class="titulo chico">Configuración</h1>

            <div class="configCuerpo">
                <button class="seccion" data-sec="secSens">Sensibilidad <span class="mas">+</span></button>
                <div class="seccionCuerpo" id="secSens" hidden>
                    <div class="fila">
                        <span class="filaEtiqueta">Mouse</span>
                        <input class="deslizador" id="ajSensMouse" type="range" min="0.2" max="3" step="0.1">
                        <span class="valor" id="ajSensMouseV"></span>
                    </div>
                    <div class="fila">
                        <span class="filaEtiqueta">Dedo (celular)</span>
                        <input class="deslizador" id="ajSensDedo" type="range" min="0.2" max="3" step="0.1">
                        <span class="valor" id="ajSensDedoV"></span>
                    </div>
                </div>

                <button class="seccion" data-sec="secSonidos">Sonidos <span class="mas">+</span></button>
                <div class="seccionCuerpo" id="secSonidos" hidden>
                    <div class="fila">
                        <span class="filaEtiqueta">Volumen</span>
                        <input class="deslizador" id="ajVolumen" type="range" min="0" max="1" step="0.05">
                        <span class="valor" id="ajVolumenV"></span>
                    </div>
                    <div class="fila">
                        <span class="filaEtiqueta">Silenciar</span>
                        <button class="interruptor" id="ajSilencio"></button>
                    </div>
                </div>

                <button class="seccion" data-sec="secControles">Controles <span class="mas">+</span></button>
                <div class="seccionCuerpo" id="secControles" hidden>
                    <div id="ajTeclas"></div>
                    <div class="fila">
                        <span class="filaEtiqueta">Invertir mira vertical</span>
                        <button class="interruptor" id="ajInvertir"></button>
                    </div>
                    <div class="fila">
                        <button class="enlace" id="ajRestablecer">Restablecer controles</button>
                    </div>
                </div>
            </div>

            <div class="botones" style="bottom: 8vh;">
                <button class="boton" id="btnSalir" hidden>Salir al menú</button>
                <button class="boton" id="btnVolver">Volver</button>
            </div>
        </div>

<div id="pausa">
            <div class="pausaCaja">
                <h1 class="pausaTitulo">Pausa</h1>
                <button class="boton pausaBoton" id="pausaReanudar">Reanudar</button>
                <button class="boton pausaBoton" id="pausaConfig">Configuración</button>
                <button class="boton pausaBoton" id="pausaCerrarServidor" hidden>Cerrar servidor</button>
                <button class="boton pausaBoton" id="pausaSalir">Salir al menú</button>
            </div>
        </div>

<div id="aviso" class="aviso"></div>

// ===== FUEGO ROJO (textura animada) =====
const FUERZA = 0.7;     // intensidad del fuego (0.6 = más suave, 1.4 = más fuerte)
const BRASAS = 0.1;     // cantidad de brasas (0 = ninguna)

const lienzoFuego = document.getElementById("fuegoFondo");
const gl2 = lienzoFuego.getContext("webgl", { alpha: true, premultipliedAlpha: true, antialias: false });
let uRes = null, uT = null, uFuerza = null;

if (gl2) {
    const vsSrc = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
    const fsSrc = `
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif
        uniform vec2 res;
        uniform float t;
        uniform float fuerza;

        float hsh(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
        }
        float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hsh(i);
            float b = hsh(i + vec2(1.0, 0.0));
            float c = hsh(i + vec2(0.0, 1.0));
            float d = hsh(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }
        float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            for (int i = 0; i < 5; i++) {
                v += a * noise(p);
                p = p * 2.02 + vec2(1.7, 9.2);
                a *= 0.5;
            }
            return v;
        }
        void main() {
            vec2 uv = gl_FragCoord.xy / res;
            float asp = res.x / res.y;
            vec2 p = vec2(uv.x * asp, uv.y);

            // Zonas iluminadas (las mismas del fondo): arriba derecha, abajo izquierda y dos manchas chicas
            float d1 = length(p - vec2(0.92 * asp, 0.96)) / 0.95;
            float d2 = length(p - vec2(0.04 * asp, 0.04)) / 0.80;
            float d3 = length(p - vec2(0.12 * asp, 0.50)) / 0.22;
            float d4 = length(p - vec2(0.42 * asp, 0.22)) / 0.25;
            float m = clamp(max(max(1.0 - d1, 0.85 * (1.0 - d2)), max(0.45 * (1.0 - d3), 0.30 * (1.0 - d4))), 0.0, 1.0);

            // Ruido deformado: da las vetas y remolinos del fuego
            vec2 s = vec2(p.x, p.y - t * 0.05) * 3.2;
            float qx = fbm(s + vec2(t * 0.04, 0.0));
            float qy = fbm(s + vec2(5.2, -t * 0.03));
            float f = fbm(s + 2.6 * vec2(qx, qy));

            float dens = smoothstep(0.22 + 0.28 * (1.0 - m), 0.75 + 0.2 * (1.0 - m), f) * smoothstep(0.0, 0.5, m);
            dens = clamp(dens * fuerza, 0.0, 1.0);
            float core = smoothstep(0.55, 1.0, dens);
            vec3 c = vec3(0.05 + 0.75 * dens + 0.2 * core, 0.10 * core, 0.03 * core);
            gl_FragColor = vec4(c * dens, dens);
        }
    `;
    function crearShader(tipo, src) {
        const sh = gl2.createShader(tipo);
        gl2.shaderSource(sh, src);
        gl2.compileShader(sh);
        return sh;
    }
    const prog = gl2.createProgram();
    gl2.attachShader(prog, crearShader(gl2.VERTEX_SHADER, vsSrc));
    gl2.attachShader(prog, crearShader(gl2.FRAGMENT_SHADER, fsSrc));
    gl2.linkProgram(prog);
    gl2.useProgram(prog);
    const bufFuego = gl2.createBuffer();
    gl2.bindBuffer(gl2.ARRAY_BUFFER, bufFuego);
    gl2.bufferData(gl2.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl2.STATIC_DRAW);
    const locP = gl2.getAttribLocation(prog, "p");
    gl2.enableVertexAttribArray(locP);
    gl2.vertexAttribPointer(locP, 2, gl2.FLOAT, false, 0, 0);
    uRes = gl2.getUniformLocation(prog, "res");
    uT = gl2.getUniformLocation(prog, "t");
    uFuerza = gl2.getUniformLocation(prog, "fuerza");
}

// Se dibuja a baja resolución (es una textura suave) para que ande rápido en el celular
function medirFuego() {
    lienzoFuego.width = Math.max(2, Math.round(window.innerWidth * 0.4));
    lienzoFuego.height = Math.max(2, Math.round(window.innerHeight * 0.4));
    if (gl2) gl2.viewport(0, 0, lienzoFuego.width, lienzoFuego.height);
}
window.addEventListener("resize", medirFuego);
medirFuego();

function dibujarFuegoGL(t) {
    if (!gl2) return;
    gl2.clearColor(0, 0, 0, 0);
    gl2.clear(gl2.COLOR_BUFFER_BIT);
    gl2.uniform2f(uRes, lienzoFuego.width, lienzoFuego.height);
    gl2.uniform1f(uT, t);
    gl2.uniform1f(uFuerza, FUERZA);
    gl2.drawArrays(gl2.TRIANGLE_STRIP, 0, 4);
}

// ===== BRASAS (puntitos y rayitas naranjas como en la foto) =====
const brasas = [];
let acumBrasas = 0;

function dibujarFuego(dt, t) {
    const escala = alto / 500;
    acumBrasas += dt * 28 * BRASAS;
    while (acumBrasas >= 1) {
        acumBrasas -= 1;
        if (brasas.length > 90) break;
        brasas.push({
            x: Math.random() * ancho,
            y: Math.random() * alto,
            vx: (4 + Math.random() * 18) * escala,
            vy: -(6 + Math.random() * 30) * escala,
            vida: 0,
            dura: 2 + Math.random() * 3,
            raya: Math.random() < 0.3,
            f: Math.random() * 6.28
        });
    }
    ctx.lineCap = "round";
    for (let i = brasas.length - 1; i >= 0; i--) {
        const b = brasas[i];
        b.vida += dt;
        const k = b.vida / b.dura;
        if (k >= 1) { brasas.splice(i, 1); continue; }
        b.x += b.vx * dt + Math.sin(t * 2 + b.f) * 5 * escala * dt;
        b.y += b.vy * dt;
        ctx.globalAlpha = Math.max(0, Math.sin(k * 3.1416) * (0.6 + 0.4 * Math.sin(t * 6 + b.f)));
        ctx.strokeStyle = ctx.fillStyle = "rgb(255," + Math.round(120 + 80 * (1 - k)) + ",30)";
        if (b.raya) {
            ctx.lineWidth = 1.6 * Math.max(1, escala);
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x - b.vx * 0.25, b.y - b.vy * 0.25);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(b.x, b.y, 1.3 * Math.max(1, escala), 0, 6.2832);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
                       }
          
            let anterior = performance.now();

            function animar(ahora) {
                if (!corriendo) return;
                const dt = Math.min((ahora - anterior) / 1000, 0.05);
                anterior = ahora;
                const t = ahora / 1000;
                ctx.clearRect(0, 0, ancho, alto);
                dibujarFuego(dt, t);
                dibujarFuegoGL(t);
                for (const c of chispas) {
                    c.y -= c.v * dt;
                    c.x += Math.sin(t + c.f) * 6 * dt;
                    if (c.y < -5) { c.y = alto + 5; c.x = Math.random() * ancho; }
                    const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 1.5 + c.f));
                    ctx.fillStyle = "rgba(255,140,40," + a.toFixed(2) + ")";
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, 6.2832);
                    ctx.fill();
                }
                // Puntitos: el campo sigue hacia la derecha, así que al deslizar siempre aparecen más detrás
                desp += (destino - desp) * Math.min(1, 4 * dt);
                const paso = Math.max(26, ancho / 48);
                const maximo = paso * 0.42;
                const p = Math.min(1, Math.max(0, -desp / recorrido()));
                const vida = p < 0.6 ? 1 : 1 - (p - 0.6) / 0.4;

                if (vida > 0.02) {
                    ctx.fillStyle = "#6f3e47";
                    const primera = Math.floor((-paso - desp) / paso);
                    const ultima = Math.ceil((ancho + paso - desp) / paso);
                    for (let k = primera; k <= ultima; k++) {
                        const x = k * paso;
                        const px = x + desp;
                        for (let y = 0; y < alto + paso; y += paso) {
                            const d = y / alto + 1.46 * (x / ancho) - 1.76;
                            if (d <= 0) continue;
                            const onda = 0.65 + 0.35 * Math.sin(t * 2 - ((x + y) / paso) * 0.5);
                            const lado = maximo * Math.min(1, d * 1.8) * onda * vida;
                            ctx.fillRect(px - lado / 2, y - lado / 2, lado, lado);
                        }
                    }
                }

                requestAnimationFrame(animar);
            }
            requestAnimationFrame(animar);

            function recorrido() {
                return ancho * 1.3;
            }

            function reanudar() {
                if (corriendo) return;
                corriendo = true;
                anterior = performance.now();
                requestAnimationFrame(animar);
            }

            function abrirPartida(id) {

                if (!partida) return;
                if (!confirm('¿Borrar la partida "' + partida.nombre + '"?')) return;
                guardarPartidas(lista.filter(function (p) { return p.id !== id; }));
                dibujarPartidas();
            }

            function crearPartida(nombre) {

                lista.push(partida);
                guardarPartidas(lista);
                partidaActual = partida.id;

let pestanaActual = "partidas";
let tipoServidores = "online";
let listaCache = [];
let cargandoServidores = false;
let errorServidores = false;
let uniendose = false;
let maxNuevo = 10;
let tipoNuevo = "online";

const listaServidores = document.getElementById("listaServidores");
const buscador = document.getElementById("buscadorServidores");

const entradaServidor = document.getElementById("entradaServidor");

function mostrarAviso(texto) {
    avisoCaja.textContent = texto;
    avisoCaja.classList.add("visible");
    clearTimeout(temporizadorAviso);
    temporizadorAviso = setTimeout(function () { avisoCaja.classList.remove("visible"); }, 2800);
}

function leerNombreJugador() {
    try { return localStorage.getItem("rainster_nombre") || "Jugador"; } catch (e) { return "Jugador"; }
}

function guardarNombreJugador(nombre) {
    try { localStorage.setItem("rainster_nombre", nombre); } catch (e) {}
}

// Pide la lista de servidores
function pedirServidores() {
    fetch("/api/servidores", { cache: "no-store" })
        .then(function (r) {
            if (!r.ok) return [];
            return r.json();
        })
        .then(function (lista) {
            listaCache = Array.isArray(lista) ? lista : [];
            errorServidores = false;
        })
        .catch(function (e) {
            if (e instanceof TypeError) {
                errorServidores = true;   // sin internet / servidor apagado
            } else {
                listaCache = [];
                errorServidores = false;
            }
        })
        .then(function () {
            cargandoServidores = false;
            dibujarServidores();
        });
}

// Dibuja la lista (con el filtro de Online / LAN y el buscador)
function dibujarServidores() {
    const y = listaServidores.scrollTop;
    listaServidores.innerHTML = "";

    function mensaje(texto, conReintento) {
        const p = document.createElement("p");
        p.className = "vacio";
        p.textContent = texto;
        listaServidores.appendChild(p);
        if (conReintento) {
            const b = document.createElement("button");
            b.className = "enlace";
            b.style.cssText = "display:block;margin:1rem auto 0;";
            b.textContent = "Reintentar";
            b.addEventListener("click", function () {
                cargandoServidores = true;
                dibujarServidores();
                pedirServidores();
            });
            listaServidores.appendChild(b);
        }
    }

    if (cargandoServidores) { mensaje("Buscando servidores..."); return; }
    if (errorServidores) { mensaje("No se pudo conectar con el servidor", true); return; }

    const texto = buscador.value.trim().toLowerCase();
    const lista = listaCache.filter(function (s) {
        return s.tipo === tipoServidores &&
            (!texto || s.nombre.toLowerCase().includes(texto) || s.host.toLowerCase().includes(texto));
    });

    if (lista.length === 0) {
        mensaje(texto ? "Ningún servidor coincide con tu búsqueda" : "No hay servidores disponibles");
        return;
    }

    lista.forEach(function (s) {
        const lleno = s.jugadores >= s.max;
        const tarjeta = document.createElement("div");
        tarjeta.className = "partida" + (lleno ? " lleno" : "");

        const textos = document.createElement("div");
        const nombre = document.createElement("div");
        nombre.className = "partidaNombre";
        nombre.textContent = s.nombre;
        const info = document.createElement("div");
        info.className = "partidaInfo";
        info.textContent = "Host: " + s.host + "  ·  " + (s.tipo === "online" ? "Online" : "LAN");
        textos.appendChild(nombre);
        textos.appendChild(info);

        const cupo = document.createElement("div");
        cupo.className = "servidorCupo";
        cupo.textContent = s.jugadores + "/" + s.max;

        tarjeta.addEventListener("click", function () { unirseServidor(s); });
        tarjeta.appendChild(textos);
        tarjeta.appendChild(cupo);
        if (leerTokens()[s.id]) {
            const cerrar = document.createElement("button");
            cerrar.className = "partidaBorrar";
            cerrar.title = "Cerrar servidor";
            cerrar.textContent = "✕";
            cerrar.addEventListener("click", function (e) {
                e.stopPropagation();
                if (!confirm('¿Cerrar el servidor "' + s.nombre + '"? Se va a sacar a todos los jugadores.')) return;
                cerrarServidorPropio(s.id, function () { pedirServidores(); });
            });
            tarjeta.appendChild(cerrar);
        }
        listaServidores.appendChild(tarjeta);
    });
    listaServidores.scrollTop = y;
}

// Entra a un servidor
function unirseServidor(s) {
    if (uniendose) return;
    if (s.jugadores >= s.max) { mostrarAviso("Ese servidor está lleno"); return; }
    uniendose = true;
    mostrarAviso("Conectando a " + s.nombre + "...");
    window.conectarServidor(s.id, leerNombreJugador(), function () {
        uniendose = false;
        servidorActual = s.id;
        partidaActual = null;
        entrarAlJuego();
    }, function (motivo) {
        uniendose = false;
        mostrarAviso(motivo || "No se pudo entrar al servidor");
        pedirServidores();
    });
}

// Ventanita para crear un servidor
function actualizarCupoNuevo() {
    document.getElementById("cupoNuevo").textContent = maxNuevo;
}

function elegirTipoNuevo(tipo) {
    tipoNuevo = tipo;
    document.getElementById("tipoOnline").classList.toggle("activa", tipo === "online");
    document.getElementById("tipoLan").classList.toggle("activa", tipo === "lan");
}

function abrirModalServidor() {
    entradaHost.value = leerNombreJugador();
    entradaServidor.value = "Servidor de " + leerNombreJugador();
    maxNuevo = 10;
    actualizarCupoNuevo();
    elegirTipoNuevo(tipoServidores);
    modalServidor.classList.add("visible");
    entradaServidor.focus();
    entradaServidor.select();
}

function cerrarModalServidor() {
    modalServidor.classList.remove("visible");
}

function confirmarServidor() {
    if (uniendose) return;
    const nombre = entradaServidor.value.trim().slice(0, 30) || "Servidor sin nombre";
    const host = entradaHost.value.trim().slice(0, 20) || "Jugador";
    guardarNombreJugador(host);

    fetch("/api/servidores", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre: nombre, host: host, max: maxNuevo, tipo: tipoNuevo })
    })
        .then(function (r) {
            return r.json().then(function (datos) {
                if (!r.ok) throw new Error(datos.error || "No se pudo crear el servidor");
                return datos;
            });
        })
        .then(function (datos) {
            guardarToken(datos.id, datos.token);
            cerrarModalServidor();
            unirseServidor({ id: datos.id, nombre: nombre, jugadores: 0, max: maxNuevo });
        })
                .catch(function (e) {
            if (e instanceof TypeError) mostrarAviso("No se pudo conectar con el servidor");
            else if (e instanceof SyntaxError) mostrarAviso("El servidor no está actualizado: reinicialo");
            else mostrarAviso(e.message);
        });
}

    document.getElementById("subOnline").classList.add("activa");

                } else {
                    menu.classList.remove("config");
                    destino = 0;
                }
            });

// ===== PAUSA =====
            const pausa = document.getElementById("pausa");
            let pausado = false;
            let tPausa = 0;
            let atrasPuesto = false;

            function ponerEstadoAtras() {
                try { history.pushState({ rainster: 1 }, "", location.href); } catch (e) {}
            }

            function configAbiertaEnJuego() {
                return menu.classList.contains("config") && !menu.classList.contains("oculto");
            }

            function abrirPausa() {
                if (!enJuego || pausado) return;
                pausado = true;
                tPausa = performance.now();
                window.juegoPausado = true;
                if (window.soltarControles) window.soltarControles();
                try { document.exitPointerLock(); } catch (e) {}
                btnConfigJuego.style.display = "none";
                document.getElementById("pausaCerrarServidor").hidden = !(servidorActual && leerTokens()[servidorActual]);
                pausa.classList.add("visible");
            }

            function cerrarPausa() {
                if (!pausado) return;
                pausado = false;
                tPausa = performance.now();
                window.juegoPausado = false;
                pausa.classList.remove("visible");
                btnConfigJuego.style.display = "block";
                if (!("ontouchstart" in window)) {
                    try { document.getElementById("juego").requestPointerLock(); } catch (e) {}
                }
            }

            function abrirConfigDesdePausa() {
                pausa.classList.remove("visible");
                clearTimeout(temporizador);
                reanudar();
                menu.style.display = "block";
                menu.classList.add("config");
                desp = -recorrido();
                destino = desp;
                void menu.offsetWidth;
                menu.classList.remove("oculto");
            }

            function volverAPausa() {
                tPausa = performance.now();
                menu.classList.add("oculto");
                temporizador = setTimeout(function () {
                    menu.style.display = "none";
                    menu.classList.remove("jugar");
                    menu.classList.remove("config");
                    corriendo = false;
                    desp = 0;
                    destino = 0;
                }, 700);
                pausa.classList.add("visible");
            }

            function salirDelJuego() {
                if (servidorActual && leerTokens()[servidorActual]) {
                    if (confirm("Sos el host de este servidor.\n\nAceptar: cerrar el servidor para todos\nCancelar: salir y dejarlo abierto")) {
                        window.cerrandoMiServidor = true;
                        cerrarServidorPropio(servidorActual, function () { location.reload(); });
                        return;
                    }
                }
                location.reload();
            }

            document.getElementById("pausaReanudar").addEventListener("click", cerrarPausa);
            document.getElementById("pausaConfig").addEventListener("click", abrirConfigDesdePausa);
            document.getElementById("pausaSalir").addEventListener("click", salirDelJuego);
            document.getElementById("pausaCerrarServidor").addEventListener("click", function () {
                if (!servidorActual) return;
                if (!confirm("¿Cerrar el servidor? Se va a sacar a todos los jugadores.")) return;
                window.cerrandoMiServidor = true;
                cerrarServidorPropio(servidorActual, function (ok) {
                    if (ok) location.reload();
                    else window.cerrandoMiServidor = false;
                });
            });
            btnConfigJuego.addEventListener("click", abrirPausa);

            // Botón "atrás" del celular
            window.addEventListener("popstate", function () {
                if (!enJuego) return;
                ponerEstadoAtras();
                if (!pausado) abrirPausa();
                else if (configAbiertaEnJuego()) volverAPausa();
                else cerrarPausa();
            });

            // Escape en la compu (si el mouse estaba capturado, el navegador lo suelta y se abre la pausa)
            document.addEventListener("pointerlockchange", function () {
                if (enJuego && !pausado && !document.pointerLockElement) abrirPausa();
            });
            window.addEventListener("keydown", function (e) {
                if (e.key !== "Escape" || !enJuego) return;
                if (performance.now() - tPausa < 300) return;
                if (!pausado) abrirPausa();
                else if (configAbiertaEnJuego()) volverAPausa();
                else cerrarPausa();
            });

            // ===== CERRAR SERVIDORES PROPIOS =====
            const CLAVE_TOKENS = "rainster_mis_servidores";
            let servidorActual = null;

            function leerTokens() {
                try { return JSON.parse(localStorage.getItem(CLAVE_TOKENS)) || {}; } catch (e) { return {}; }
            }
            function escribirTokens(t) {
                try { localStorage.setItem(CLAVE_TOKENS, JSON.stringify(t)); } catch (e) {}
            }
            function guardarToken(id, token) {
                const t = leerTokens();
                t[id] = token;
                escribirTokens(t);
            }
            function olvidarToken(id) {
                const t = leerTokens();
                delete t[id];
                escribirTokens(t);
            }

            function cerrarServidorPropio(id, alTerminar) {
                const token = leerTokens()[id];
                if (!token) { alTerminar(false); return; }
                fetch("/api/servidores/cerrar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: id, token: token })
                })
                    .then(function (r) {
                        if (r.ok || r.status === 404) olvidarToken(id);
                        alTerminar(r.ok);
                    })
                    .catch(function () {
                        mostrarAviso("No se pudo conectar con el servidor");
                        alTerminar(false);
                    });
            }

        })();
    </script>

<script>
        // ===== AJUSTES: sensibilidad, sonidos y controles =====
        (function () {
            if (!window.Ajustes) return;
            const A = window.Ajustes.datos;
            const guardar = function () { window.Ajustes.guardar(); };
            const esCelu = "ontouchstart" in window;
            const $ = function (id) { return document.getElementById(id); };

            // Secciones que se abren y cierran con el +
            document.querySelectorAll(".seccion").forEach(function (boton) {
                boton.addEventListener("click", function () {
                    const cuerpo = document.getElementById(boton.dataset.sec);
                    const abrir = cuerpo.hidden;
                    document.querySelectorAll(".seccionCuerpo").forEach(function (c) { c.hidden = true; });
                    document.querySelectorAll(".seccion .mas").forEach(function (m) { m.textContent = "+"; });
                    cuerpo.hidden = !abrir;
                    boton.querySelector(".mas").textContent = abrir ? "−" : "+";
                });
            });

            // Sonido de prueba para escuchar el volumen
            let audio = null;
            function pitido() {
                const vol = window.Ajustes.volumenFinal();
                if (vol <= 0) return;
                try {
                    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
                    const o = audio.createOscillator();
                    const g = audio.createGain();
                    o.frequency.value = 440;
                    g.gain.value = 0.2 * vol;
                    o.connect(g);
                    g.connect(audio.destination);
                    o.start();
                    o.stop(audio.currentTime + 0.15);
                } catch (e) {}
            }

            function porcentaje(v) { return Math.round(v * 100) + "%"; }

            // Deslizadores
            function deslizador(id, clave, alSoltar) {
                const barra = $(id);
                const valor = $(id + "V");
                barra.value = A[clave];
                valor.textContent = porcentaje(A[clave]);
                barra.addEventListener("input", function () {
                    A[clave] = parseFloat(barra.value);
                    valor.textContent = porcentaje(A[clave]);
                    guardar();
                });
                if (alSoltar) barra.addEventListener("change", alSoltar);
            }
            deslizador("ajSensMouse", "sensMouse");
            deslizador("ajSensDedo", "sensDedo");
            deslizador("ajVolumen", "volumen", pitido);

            // Botones de sí / no
            function interruptor(id, clave, alCambiar) {
                const b = $(id);
                function pintar() {
                    b.textContent = A[clave] ? "Sí" : "No";
                    b.classList.toggle("activo", !!A[clave]);
                }
                pintar();
                b.addEventListener("click", function () {
                    A[clave] = !A[clave];
                    guardar();
                    pintar();
                    if (alCambiar) alCambiar();
                });
                return pintar;
            }
            interruptor("ajSilencio", "silencio", pitido);
            const pintarInvertir = interruptor("ajInvertir", "invertirY");

            // Teclas
            const ACCIONES = [
                ["adelante", "Adelante"],
                ["atras", "Atrás"],
                ["izquierda", "Izquierda"],
                ["derecha", "Derecha"],
                ["saltar", "Saltar"],
                ["correr", "Correr"]
            ];
            const NOMBRES = {
                Space: "Espacio", ShiftLeft: "Shift izq.", ShiftRight: "Shift der.",
                ControlLeft: "Ctrl izq.", ControlRight: "Ctrl der.", AltLeft: "Alt izq.",
                AltRight: "Alt der.", Tab: "Tab", Enter: "Enter", Backspace: "Retroceso",
                ArrowUp: "↑", ArrowDown: "↓", ArrowLeft: "←", ArrowRight: "→"
            };
            function nombreTecla(codigo) {
                if (NOMBRES[codigo]) return NOMBRES[codigo];
                if (codigo.indexOf("Key") === 0) return codigo.slice(3);
                if (codigo.indexOf("Digit") === 0) return codigo.slice(5);
                return codigo;
            }

            const cajaTeclas = $("ajTeclas");
            let esperando = false;

            function dibujarTeclas() {
                cajaTeclas.innerHTML = "";
                if (esCelu) {
                    const p = document.createElement("p");
                    p.className = "vacio";
                    p.style.margin = "0.4rem 0";
                    p.textContent = "Izquierda: mover · Derecha: mirar";
                    cajaTeclas.appendChild(p);
                    return;
                }
                ACCIONES.forEach(function (par) {
                    const fila = document.createElement("div");
                    fila.className = "fila";
                    const et = document.createElement("span");
                    et.className = "filaEtiqueta";
                    et.textContent = par[1];
                    const b = document.createElement("button");
                    b.className = "tecla";
                    b.textContent = nombreTecla(A.teclas[par[0]]);
                    b.addEventListener("click", function () { esperarTecla(par[0], b); });
                    fila.appendChild(et);
                    fila.appendChild(b);
                    cajaTeclas.appendChild(fila);
                });
            }

            function esperarTecla(accion, boton) {
                if (esperando) return;
                esperando = true;
                boton.textContent = "Presioná una tecla...";
                function alPresionar(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    document.removeEventListener("keydown", alPresionar, true);
                    esperando = false;
                    if (e.code !== "Escape") {
                        // si otra acción ya usaba esa tecla, se intercambian
                        for (const otra in A.teclas) {
                            if (otra !== accion && A.teclas[otra] === e.code) A.teclas[otra] = A.teclas[accion];
                        }
                        A.teclas[accion] = e.code;
                        guardar();
                    }
                    dibujarTeclas();
                }
                document.addEventListener("keydown", alPresionar, true);
            }

            $("ajRestablecer").addEventListener("click", function () {
                window.Ajustes.restablecerControles();
                pintarInvertir();
                dibujarTeclas();
            });

            dibujarTeclas();
        })();
    </script>
